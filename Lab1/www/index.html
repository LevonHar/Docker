<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lab 1 — Ubuntu Server</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f7fb;
      color: #1b2430;
      font-family: Georgia, "Times New Roman", serif;
    }
    main {
      max-width: 640px;
      margin: 48px auto;
      padding: 32px 36px;
      background: #ffffff;
      border: 1px solid #d5deea;
      border-radius: 12px;
    }
    h1 { margin: 0 0 12px; font-size: 32px; }
    p { margin: 8px 0; font-size: 18px; line-height: 1.5; }
    .meta { color: #3d4d63; }
  </style>
</head>
<body>
  <main>
    <h1>Hello from Ubuntu Server</h1>
    <p>This page is served by Nginx on the lab virtual machine.</p>
    <p class="meta">Host: ubuntu-server</p>
    <p class="meta">URL: http://127.0.0.1:8080/</p>
  </main>
</body>
</html>
